name: build
on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27.1'

      - name: Test generated Spring GraphQL output
        run: go test -mod=vendor ./...

      - name: Build
        run: go build -mod=vendor -trimpath -ldflags "-X main.Version=2.0.0" .